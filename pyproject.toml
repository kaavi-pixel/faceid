[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "faceid"
version = "1.0.0"
description = "AI face authentication for Fedora (GNOME + KDE) that keeps working with a hat or headphones on, and can approve sudo"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "kaavi-pixel" }]
keywords = ["face-recognition", "pam", "sudo", "fedora", "gnome", "kde",
            "biometrics", "opencv", "onnx", "linux"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
]
# On Fedora install these with dnf instead - no pip build step, no compiler,
# no disk cost (they are already part of a Workstation install):
#   sudo dnf install python3-opencv python3-numpy
dependencies = ["numpy>=1.24", "opencv-python>=4.8"]

[project.urls]
Homepage = "https://github.com/kaavi-pixel/faceid"
Issues = "https://github.com/kaavi-pixel/faceid/issues"

[project.scripts]
faceid = "faceid.cli:main"

[tool.setuptools]
packages = ["faceid"]
